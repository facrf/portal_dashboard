worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limiting para proteção contra força bruta no login
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self'" always;

        # Substitui o mod_rewrite do Apache (URLs amigáveis)
        location ^~ /db_data/ { deny all; }
        location ^~ /tests/ { deny all; }
        location ^~ /templates/ { deny all; }
        location ^~ /lang/ { deny all; }
        location ~ ^/(?:db|database|auth|helpers|health|imports|i18n)\.php$ { deny all; }
        location ~* \.(?:db|sqlite|sqlite3)(?:-wal|-shm|-journal)?$ { deny all; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # A pasta gravável de ícones nunca pode executar scripts.
        location ~* ^/icons/.*\.(?:php|phtml|phar)(?:/|$) {
            deny all;
        }

        # Favicon dedicado para evitar execução desnecessária do PHP-FPM quando inexistente
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            try_files $uri =204;
        }

        # Cache de arquivos estáticos (fontes, estilos, scripts, manifest e imagens)
        location ~* \.(?:css|js|woff2|webmanifest|png|jpg|jpeg|gif|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri =404;
        }

        # Envia os arquivos .php para o PHP-FPM processar
        location = /login.php {
            limit_req zone=login_limit burst=20 nodelay;
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Content-Type-Options;
            fastcgi_hide_header X-Frame-Options;
            fastcgi_hide_header Referrer-Policy;
            fastcgi_hide_header Permissions-Policy;
            fastcgi_hide_header Content-Security-Policy;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Content-Type-Options;
            fastcgi_hide_header X-Frame-Options;
            fastcgi_hide_header Referrer-Policy;
            fastcgi_hide_header Permissions-Policy;
            fastcgi_hide_header Content-Security-Policy;
        }

        # Nega acesso a arquivos ocultos (como .git ou .env)
        location ~ /\. {
            deny all;
        }

        location ~* \.(?:db|sqlite|sqlite3|sql|bak|lock)$ {
            deny all;
        }

        location ~* \.migration\.lock$ {
            deny all;
        }
    }
}
