name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [ "main" ] # Dispara sempre que houver push na branch main
    paths-ignore:
      - '**/*.md'         # Ignora qualquer arquivo Markdown (como o README.md) em qualquer pasta
      - 'LICENSE'         # Ignora alterações no arquivo de licença
      - '.gitignore'      # Ignora o arquivo do git
      - 'icons/**'        # Ignora tudo o que estiver dentro da pasta icons
  release:
    types: [published] # Dispara quando criar uma nova Release/Tag

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t portal-dashboard:test .
      - name: Run PHP checks
        run: docker run --rm portal-dashboard:test php tests/run.php

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permissão obrigatória para poder enviar a imagem ao GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configura o QEMU (Necessário para emular processadores ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all # Habilita emulação total, incluindo riscv64

      # 2. Configura o Docker Buildx (Motor que cria imagens multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 3. A Mágica Acontece Aqui: Definindo as arquiteturas
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
