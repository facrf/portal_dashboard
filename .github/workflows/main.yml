name: Validate and publish GHCR images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore
      - 'icons/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t portal-dashboard:test .
      - name: PHP migration, authentication, import and monitoring checks
        run: docker run --rm portal-dashboard:test php tests/run.php
      - name: HTTP integration against Nginx and PHP-FPM
        run: |
          docker run --rm -d --name portal-integration -p 127.0.0.1:18080:80 portal-dashboard:test
          trap 'docker stop portal-integration >/dev/null' EXIT
          python3 tests/integration.py
          docker run --rm --network container:portal-integration -v "$PWD:/app:ro" -w /app node:22-alpine node tests/rendered.cjs
      - name: JavaScript syntax and save recovery checks
        run: docker run --rm -v "$PWD:/app:ro" -w /app node:22-alpine sh -c 'node --check assets/ui.js && node tests/ui.cjs'

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm,riscv64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Publish supported architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
